const $=s=>document.querySelector(s),KEY='ririji.offline.v1',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function dateKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const today=()=>dateKey(new Date()),asDate=s=>new Date(s+'T12:00:00'),shift=(s,n)=>{let d=asDate(s);d.setDate(d.getDate()+n);return dateKey(d)},validDate=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&dateKey(asDate(s))===s;

let data,storageOK=true,loadIssue='';try{if(window.__lijiReadError)throw Error('native read failed');const raw=localStorage.getItem(KEY);data=window.__lijiInitial?validate(window.__lijiInitial):(raw?validate(JSON.parse(raw)):seed())}catch(e){data=seed();storageOK=false;loadIssue='无法读取已有记录，暂时使用临时数据。原数据不会被覆盖，请先导出备份或检查浏览器设置。'}

function record(id,d=selected,create=false){if(create){data.records[d]??={};data.records[d][id]??={done:false,tags:[],note:''};return data.records[d][id]}return data.records[d]?.[id]||{done:false,tags:[],note:''}}
const completed=(d)=>Object.values(data.records[d]||{}).filter(r=>r.done).length;
function weekDates(){let t=asDate(today());let n=(t.getDay()+6)%7;return Array.from({length:7},(_,i)=>shift(today(),i-n))}
function rangeDates(){const t=today();if(period==='week')return weekDates().filter(d=>d<=t);if(period==='month'){return Array.from({length:Number(t.slice(-2))},(_,i)=>t.slice(0,8)+String(i+1).padStart(2,'0'))}return Object.keys(data.records).filter(d=>d<=t).sort()}

function header(title,sub,action=''){return `<div class="top"><div><div class="eyebrow">DO IT NOW / 立记</div><h1>${title}</h1><p class="subtitle">${sub}</p></div>${action}</div>`}
function daily(){let active=data.activities.filter(a=>!a.archived||(selected!==today()&&data.records[selected]?.[a.id]));let done=active.filter(a=>record(a.id).done).length,percent=active.length?Math.round(done/active.length*100):0;return header('把今天，记下来。','不必每一天都完美，每一小步都值得记录。','<button class="primary" data-action="new">＋ 新建活动</button>')+`<div class="layout"><section><div class="summary"><div><h2>${!active.length?'从你想做的一件事开始。':done===active.length&&active.length?'今天的小目标，都完成了。':done?'又积累了一点，继续就好。':'新的一天，从一个小小的勾开始。'}</h2><p>${selected===today()?'今天':esc(selected)}已完成 ${done} / ${active.length} 项活动</p></div><div class="ring" style="background:conic-gradient(var(--green) ${percent}%,#dce9df 0)"><span>${percent}%</span></div></div><div class="toolbar"><h2>每日活动 <small style="font-size:12px;font-weight:400">${active.length} 项</small></h2><div class="datebar"><button class="iconbtn" data-action="prev" aria-label="前一天">‹</button><input id="datepick" type="date" aria-label="查看日期" value="${selected}" max="${today()}"><button class="iconbtn" data-action="next" aria-label="后一天" ${selected>=today()?'disabled':''}>›</button><button class="iconbtn" data-action="today">今天</button></div></div>${active.map(a=>card(a)).join('')||'<div class="panel empty">还没有打卡活动。<br>添加你想坚持的第一件事。<br><button class="primary" style="margin-top:18px" data-action="new">＋ 创建第一个活动</button></div>'}<p class="muted" style="font-size:12px;padding:0 4px">勾选即完成 · 标签和备注选填 · 更改自动保存</p></section><aside class="aside"><div class="panel">${calendar()}</div><div class="panel"><div class="rowtop"><h3>这一周</h3><small>完成活动次数</small></div><div class="weekbars">${weekDates().map((d,i)=>{let n=completed(d),max=Math.max(1,...weekDates().map(completed));return `<div class="barcol"><span>${n||'·'}</span><div class="bar" style="height:${Math.max(4,n/max*65)}px;${d===today()?'background:var(--green)':''}"></div><span>${['一','二','三','四','五','六','日'][i]}</span></div>`}).join('')}</div></div><p class="quote">不用赶路，也能向前。<br>留一个记号，给认真生活的自己。</p></aside></div>`}
function card(a){let r=record(a.id),open=openCards.has(a.id),tags=[...new Set([...a.tags,...r.tags])];return `<article class="panel activity ${r.done?'done':''}" data-id="${a.id}" style="--accent:${a.color}"><div class="cardhead"><div class="activity-icon">${esc(a.icon)}</div><div class="cardname"><h3>${esc(a.name)}${a.archived?' <small>已归档</small>':''}</h3><small>${r.done?'已完成，给自己一个肯定':'留一点时间给这件事'}</small></div><label class="check"><input type="checkbox" data-check="${a.id}" ${r.done?'checked':''} aria-label="${esc(a.name)}完成状态"><span>${r.done?'已完成':'完成'}</span></label></div>${open?`<div class="cardbody"><span class="label">今天做了什么？ <small>可多选</small></span><div class="chips">${tags.map(t=>`<button class="chip ${r.tags.includes(t)?'selected':''}" data-tag="${esc(t)}" aria-pressed="${r.tags.includes(t)}">${esc(t)}</button>`).join('')}<button class="chip tagadd" data-addtag>＋ 新标签</button></div><div class="inline hidden" data-taginput><input maxlength="30" placeholder="标签名称" aria-label="新标签名称"><button data-savetag>添加</button></div><label class="label" for="note-${a.id}">留一句备注</label><textarea id="note-${a.id}" data-note="${a.id}" maxlength="2000" placeholder="今天有什么想记住的？">${esc(r.note)}</textarea></div>`:''}<div class="cardbottom"><span class="notehint">${!open?esc(r.tags.join(' · ')||'标签与备注'):r.done?'这份努力，已经记下了。':'可以先记录，完成后再勾选。'}</span><button class="details" data-expand="${a.id}">${open?'收起 ⌃':'标签 / 备注 ⌄'}</button></div></article>`}
function calendar(){let y=Number(calMonth.slice(0,4)),m=Number(calMonth.slice(5)),first=new Date(y,m-1,1,12),offset=(first.getDay()+6)%7,n=new Date(y,m,0).getDate();return `<div class="calhead"><b>${y} 年 ${m} 月</b><div><button data-calmove="-1" aria-label="上一月">‹</button><button data-calmove="1" aria-label="下一月">›</button></div></div><div class="calendar">${['一','二','三','四','五','六','日'].map(t=>`<span class="weekday">${t}</span>`).join('')}${'<span></span>'.repeat(offset)}${Array.from({length:n},(_,i)=>{let d=calMonth+'-'+String(i+1).padStart(2,'0');return `<button class="day ${d===selected?'sel':''} ${d===today()?'today':''}" data-date="${d}" ${d>today()?'disabled':''} aria-label="${d}，完成${completed(d)}项">${i+1}${completed(d)?'<i class="dot"></i>':''}</button>`}).join('')}</div><div class="legend">● 下方圆点表示当天有已完成记录</div>`}
function stats(){let dates=rangeDates(),total=dates.reduce((s,d)=>s+completed(d),0),days=dates.filter(d=>completed(d)).length,act=data.activities.filter(a=>dates.some(d=>record(a.id,d).done)).length;return header('看见每一点积累。','统计仅包含已勾选完成的记录。')+`<div class="toolbar"><h2>你的记录</h2><div class="tabs">${[['week','本周'],['month','本月'],['all','全部']].map(([v,n])=>`<button data-period="${v}" class="${period===v?'on':''}">${n}</button>`).join('')}</div></div><div class="statgrid"><div class="panel statbox"><span class="muted">有打卡的天数</span><strong>${days}<small style="font-size:13px"> 天</small></strong></div><div class="panel statbox"><span class="muted">完成活动总次数</span><strong>${total}<small style="font-size:13px"> 次</small></strong></div><div class="panel statbox"><span class="muted">参与的活动</span><strong>${act}<small style="font-size:13px"> 项</small></strong></div></div><div class="panel">${data.activities.map(a=>{let rs=dates.map(d=>record(a.id,d)).filter(r=>r.done),counts=new Map();rs.forEach(r=>new Set(r.tags).forEach(t=>counts.set(t,(counts.get(t)||0)+1)));return `<div class="statsrow"><div class="rowtop"><h3>${esc(a.icon)} ${esc(a.name)} ${a.archived?'<small>已归档</small>':''}</h3><b>${rs.length} <small>天</small></b></div><div class="meter"><i style="background:${a.color};width:${Math.round(rs.length/Math.max(1,dates.length)*100)}%"></i></div><div class="tagstats">${[...counts].sort((a,b)=>b[1]-a[1]).map(([t,n])=>`<span>${esc(t)} <b>${n}</b> 次</span>`).join('')||'<span>暂时没有已完成的标签记录</span>'}</div></div>`}).join('')||'<div class="empty">创建一个活动，开始积累吧。</div>'}</div><p class="muted" style="font-size:12px;margin-top:15px">每个活动每天最多计 1 次；多选标签分别计次。全部视图的进度条按有记录的日期数计算。</p>`}
function manage(){const section=arch=>data.activities.filter(a=>a.archived===arch).map(a=>`<div class="manageitem"><div class="activity-icon" style="--accent:${a.color}">${esc(a.icon)}</div><div class="grow"><b>${esc(a.name)}</b><div class="muted" style="font-size:12px;overflow-wrap:anywhere">${a.tags.map(esc).join(' · ')||'暂未添加标签'}</div></div><div class="actions"><button data-move="${a.id}" data-dir="-1" aria-label="上移${esc(a.name)}">↑</button><button data-move="${a.id}" data-dir="1" aria-label="下移${esc(a.name)}">↓</button><button data-edit="${a.id}">编辑</button><button data-archive="${a.id}">${arch?'恢复':'归档'}</button>${arch?`<button class="danger" data-delete="${a.id}">删除</button>`:''}</div></div>`).join('');return header('给日常，留一点位置。','按自己的节奏创建活动，标签也由你决定。','<button class="primary" data-action="new">＋ 新建活动</button>')+`<div class="divider">正在记录 · ${data.activities.filter(a=>!a.archived).length} 项</div><div class="panel">${section(false)||'<div class="empty">还没有正在记录的活动</div>'}</div>${data.activities.some(a=>a.archived)?`<div class="divider">已归档 · 历史记录保留</div><div class="panel">${section(true)}</div>`:''}<div class="panel backup"><h3>给记录留一份备份</h3><p>数据保存在本机，不会自动同步。删除 App 会删除本地记录，请定期导出到 iCloud 云盘或其他位置。</p><div class="actions"><button data-action="export">↓ 导出备份</button><button data-action="import">↑ 导入备份</button></div><small style="display:block;margin-top:12px">导入将替换当前全部记录；操作前会请你确认。</small></div>`}
function selectDate(d){if(!validDate(d)||d>today()){toast('请选择今天或过去的日期');return}selected=d;calMonth=d.slice(0,7);render()}
function deleteArchived(id){let a=data.activities.find(a=>a.id===id);if(!a||!a.archived)return;let n=Object.values(data.records).filter(rs=>Object.hasOwn(rs,id)).length;if(!confirm('永久删除“'+a.name+'”？\n将一并删除该活动的标签，以及 '+n+' 天的打卡和备注记录。\n此操作无法撤销，建议先导出备份。'))return;data.activities=data.activities.filter(a=>a.id!==id);for(const [d,rs] of Object.entries(data.records)){delete rs[id];if(!Object.keys(rs).length)delete data.records[d]}openCards.delete(id);save();render();toast('已删除该活动及其历史记录')}
function bind(){document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteArchived(b.dataset.delete));document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const a=b.dataset.action;if(a==='new')edit();if(a==='prev')selectDate(shift(selected,-1));if(a==='next')selectDate(shift(selected,1));if(a==='today')selectDate(today());if(a==='export')exportData();if(a==='import'){if(window.__lijiNative)window.webkit.messageHandlers.liji.postMessage({action:'import'});else $('#importfile').click()}});$('#datepick')?.addEventListener('change',e=>selectDate(e.target.value));document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>selectDate(b.dataset.date));document.querySelectorAll('[data-calmove]').forEach(b=>b.onclick=()=>{let d=asDate(calMonth+'-01');d.setMonth(d.getMonth()+Number(b.dataset.calmove));calMonth=dateKey(d).slice(0,7);render()});document.querySelectorAll('[data-check]').forEach(b=>b.onchange=()=>{record(b.dataset.check,selected,true).done=b.checked;save();render()});document.querySelectorAll('[data-expand]').forEach(b=>b.onclick=()=>{let id=b.dataset.expand;openCards.has(id)?openCards.delete(id):openCards.add(id);render()});document.querySelectorAll('[data-note]').forEach(t=>t.oninput=()=>{record(t.dataset.note,selected,true).note=t.value;save()});document.querySelectorAll('.activity').forEach(el=>{let id=el.dataset.id;el.querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>{let r=record(id,selected,true),tag=b.dataset.tag;r.tags=r.tags.includes(tag)?r.tags.filter(x=>x!==tag):[...r.tags,tag];save();render()});el.querySelector('[data-addtag]')?.addEventListener('click',()=>{el.querySelector('[data-taginput]').classList.toggle('hidden');el.querySelector('[data-taginput] input').focus()});const add=()=>{let input=el.querySelector('[data-taginput] input'),tag=input.value.trim(),a=data.activities.find(a=>a.id===id);if(!tag)return;if(!a.tags.includes(tag))a.tags.push(tag);let r=record(id,selected,true);if(!r.tags.includes(tag))r.tags.push(tag);save();render()};el.querySelector('[data-savetag]')?.addEventListener('click',add);el.querySelector('[data-taginput] input')?.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();add()}})});document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{period=b.dataset.period;render()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));document.querySelectorAll('[data-archive]').forEach(b=>b.onclick=()=>{let a=data.activities.find(a=>a.id===b.dataset.archive);if(!a.archived&&!confirm('归档“'+a.name+'”？历史记录会保留，也可随时恢复。'))return;a.archived=!a.archived;save();render()});document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{let i=data.activities.findIndex(a=>a.id===b.dataset.move),a=data.activities[i],dir=Number(b.dataset.dir),j=i+dir;while(j>=0&&j<data.activities.length&&data.activities[j].archived!==a.archived)j+=dir;if(j>=0&&j<data.activities.length){[data.activities[i],data.activities[j]]=[data.activities[j],data.activities[i]];save();render()}})}
function renderOldTags(){$('#oldtags').innerHTML=pendingTags.map((t,i)=>`<button type="button" data-remove="${i}" title="移除标签">${esc(t)} ×</button>`).join('');$('#oldtags').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{pendingTags.splice(Number(b.dataset.remove),1);renderOldTags()})}
function edit(id=null){editing=id;let a=data.activities.find(a=>a.id===id);$('#dialogtitle').textContent=a?'编辑活动':'新建活动';$('#aname').value=a?.name||'';$('#aicon').value=a?.icon||'🌱';if(!$('#aicon').value)$('#aicon').value='🌱';$('#acolor').value=a?.color||'#23765c';$('#tagdraft').value='';pendingTags=a?[...a.tags]:[];renderOldTags();$('#editor').showModal();$('#aname').focus()}
$('#cancel').onclick=()=>$('#editor').close();$('#editform').onsubmit=e=>{e.preventDefault();let name=$('#aname').value.trim();if(!name){toast('请填写活动名称');return}let tags=[...new Set([...pendingTags,...$('#tagdraft').value.split(/[,，、\n]/).map(s=>s.trim()).filter(Boolean)])];if(tags.some(s=>s.length>30)){toast('每个新标签请控制在30字以内');return}let fields={name,icon:$('#aicon').value,color:$('#acolor').value,tags};if(editing)Object.assign(data.activities.find(a=>a.id===editing),fields);else{let a={id:uid(),...fields,archived:false};data.activities.push(a);openCards.add(a.id)}save();$('#editor').close();render();toast('活动已更新')};
function exportData(){if(window.__lijiNative){window.webkit.messageHandlers.liji.postMessage({action:'export',text:JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2)});return;}let blob=new Blob([JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='立记-备份-'+today()+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);toast('已发起备份下载')}
$('#importfile').onchange=async e=>{let file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>10*1024*1024)throw Error('备份文件超过10MB');let incoming=validate(JSON.parse(await file.text()));if(!confirm('确认用备份替换全部活动和记录？\n备份含 '+incoming.activities.length+' 个活动、'+Object.keys(incoming.records).length+' 个记录日期。\n如需保留当前数据，请先取消并导出备份。'))return;data=incoming;storageOK=true;let ok=save();if(ok)$('#warning').classList.add('hidden');openCards=new Set(data.activities.map(a=>a.id));render();toast(ok?'备份已恢复':'已读取备份，但未能持久保存')}catch(err){alert('导入失败，当前数据未改变。\n'+err.message)}};
window.lijiImportBase64=function(b64){try{const incoming=validate(JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b64),c=>c.charCodeAt(0)))));if(!confirm('导入将替换当前全部活动和记录。是否继续？'))return;data=incoming;storageOK=true;window.__lijiReadError=false;let ok=save();if(ok)$('#warning').classList.add('hidden');openCards=new Set(data.activities.map(a=>a.id));render();toast(ok?'备份已恢复':'已读取，请立即备份')}catch(e){alert('备份格式错误，未导入：'+e.message)}};
window.lijiUpdateDate=function(){if(selected<today())selectDate(today())};
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue)warn('其他窗口更新了记录。请先导出当前需要保留的内容，再刷新页面，避免相互覆盖。')});render();
</script></body></html>
